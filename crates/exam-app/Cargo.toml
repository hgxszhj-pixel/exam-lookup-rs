[package]
name = "exam-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "exam-lookup-rs Dioxus 0.7.9 desktop GUI"

[dependencies]
# workspace
exam-engine = { path = "../exam-engine" }

# dioxus 0.7.9 desktop
dioxus = { version = "0.7.9", features = ["desktop"] }
dioxus-router = "0.7.9"
dioxus-router-macro = "0.7.9"

# serde / json
serde = { workspace = true }
serde_json = { workspace = true }

# async 通道(把后台线程的结果送回 UI 线程)
# P1-4:重建索引搬到后台 OS 线程后,需要一个 async 通道把结果交回 UI 线程更新 signal
futures-channel = "0.3"

# error
anyhow = { workspace = true }

# sqlite (used by search)
rusqlite = { workspace = true }

# logging (Step 1.1: tracing instrumentation)
tracing.workspace = true
tracing-subscriber.workspace = true

# dirs for app data path
dirs = "5.0"

[dev-dependencies]
tempfile = "3"
dioxus-ssr = "0.7.9"
[package]
name = "exam-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "exam-lookup-rs Dioxus 0.7.9 desktop GUI"

[dependencies]
# workspace
exam-engine = { path = "../exam-engine" }

# dioxus 0.7.9 desktop
dioxus = { version = "0.7.9", features = ["desktop"] }
dioxus-router = "0.7.9"
dioxus-router-macro = "0.7.9"

# serde / json
serde = { workspace = true }
serde_json = { workspace = true }

# error
anyhow = { workspace = true }

# sqlite (used by search)
rusqlite = { workspace = true }

# dirs for app data path
dirs = "5.0"

[dev-dependencies]
tempfile = "3"